[package]
name = "openidea-plugin-glassfish"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
javaee-core = { path = "../../crates/javaee-core" }
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", tag = "v0.1.49" }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
