id = "littleguava.glassfish"
name = "GlassFish"
version = "0.1.0"
description = "GlassFish and Payara through asadmin. Early version: shows the installed asadmin version; start, stop, deploy and debug are coming."
authors = ["LittleGuava"]
homepage = "https://github.com/LittleGuava/openidea-javaee-plugins"
license = "Apache-2.0"
categories = ["frameworks", "tools"]
engines.openidea = "^1.13"
wasm = "dist/plugin.wasm"

[capabilities]
required = ["process:asadmin"]

[[contributes.commands]]
id = "version"
title = "GlassFish: Show asadmin Version"
category = "GlassFish"
