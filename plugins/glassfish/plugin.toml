id = "littleguava.glassfish"
name = "GlassFish"
version = "0.1.0"
description = "Start, stop, deploy and debug applications on a local GlassFish or Payara domain through asadmin."
authors = ["LittleGuava"]
homepage = "https://github.com/LittleGuava/openidea-javaee-plugins"
license = "Apache-2.0"
categories = ["frameworks", "tools"]
engines.openidea = "^1.4"
wasm = "dist/plugin.wasm"
activation = ["on-command:*"]

[capabilities]
required = ["project.read", "process:asadmin"]

[[contributes.commands]]
id = "version"
title = "GlassFish: Show asadmin Version"
category = "GlassFish"
